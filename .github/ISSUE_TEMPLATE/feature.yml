name: Feature request
description: Propose a focused improvement within LoadComposer’s planning scope.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Domain evidence and edge cases
      description: Identify standards, equipment data, constraints, accessibility effects, translations, and safety boundaries.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope acknowledgement
      options:
        - label: I understand that a roadmap entry or request is not a commitment.
          required: true
        - label: I understand that weight, balance, safety, and regulatory claims require dedicated validation.
          required: true

<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="darkreader-lock">
  <title>__PAGE_TITLE__</title>
  <meta name="description" content="__PAGE_DESCRIPTION__" />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <meta name="theme-color" content="#F4F5F2" />
  <link rel="canonical" href="__CANONICAL_URL__" />
  <link rel="icon" href="/assets/loadcomposer-favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="__OG_TYPE__" />
  <meta property="og:site_name" content="LoadComposer" />
  <meta property="og:title" content="__PAGE_TITLE__" />
  <meta property="og:description" content="__PAGE_DESCRIPTION__" />
  <meta property="og:url" content="__CANONICAL_URL__" />
  <meta property="og:image" content="__OG_IMAGE__" />
  <meta property="og:image:width" content="__OG_IMAGE_WIDTH__" />
  <meta property="og:image:height" content="__OG_IMAGE_HEIGHT__" />
  <script type="application/ld+json">__BREADCRUMB_JSON__</script>
  <script>
    (() => {
      const root = document.documentElement;
      const allowed = new Set(["auto", "light", "dark"]);
      let preference = "auto";
      try {
        const stored = localStorage.getItem("loadcomposer.theme");
        if (allowed.has(stored)) preference = stored;
      } catch (_) {}
      const systemDark = Boolean(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      const resolved = preference === "auto" ? (systemDark ? "dark" : "light") : preference;
      root.dataset.themePreference = preference;
      root.dataset.theme = resolved;
      root.style.colorScheme = resolved;
    })();
  </script>
  <style>
    :root {
      --bg: #F4F5F2;
      --surface: #FFFFFF;
      --surface-soft: #F1F5F3;
      --text: #13272F;
      --muted: #52656C;
      --border: #D2DCD8;
      --accent: #0D7C75;
      --accent-hover: #096C66;
      --accent-soft: #DDF3F0;
      --focus: #007C73;
      --shadow: 0 1px 2px rgba(16, 36, 46, .05), 0 8px 24px rgba(16, 36, 46, .07);
    }
    :root[data-theme="dark"] {
      --bg: #050D16;
      --surface: #0D1B27;
      --surface-soft: #122330;
      --text: #E2E9EC;
      --muted: #AAB7BE;
      --border: #263B4A;
      --accent: #3BC0B5;
      --accent-hover: #4ACBC0;
      --accent-soft: #102F33;
      --focus: #60D5CB;
      --shadow: 0 1px 0 rgba(255, 255, 255, .035), 0 12px 28px rgba(0, 0, 0, .16);
    }
    * { box-sizing: border-box; }
    html { min-width: 0; background: var(--bg); }
    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.62;
    }
    a { color: inherit; }
    button, select { font: inherit; }
    .shell { width: min(1120px, 100%); margin: 0 auto; padding: 20px 22px 44px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand { display: inline-flex; min-width: 0; align-items: center; color: var(--text); text-decoration: none; }
    .brand-logo { display: none; width: 170px; max-width: 100%; height: auto; }
    .brand-logo svg { display: block; width: 100%; height: auto; }
    :root[data-theme="light"] .brand-logo.day,
    :root[data-theme="dark"] .brand-logo.night { display: block; }
    .control { display: grid; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 750; }
    .control select {
      min-height: 44px;
      padding: 8px 34px 8px 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    main { padding-top: 38px; }
    .breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 9px; margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .breadcrumb a { min-height: 36px; display: inline-flex; align-items: center; text-underline-offset: 3px; }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb [aria-current="page"] { color: var(--text); font-weight: 750; }
    .article-shell { min-width: 0; padding: clamp(24px, 4.5vw, 52px); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); }
    .prose { width: min(88ch, 100%); margin: 0 auto; overflow-wrap: anywhere; }
    h1 { margin: 0 0 20px; font-size: clamp(34px, 5vw, 50px); line-height: 1.08; letter-spacing: -.035em; }
    h2 { margin: 42px 0 14px; font-size: clamp(25px, 3.1vw, 32px); line-height: 1.2; letter-spacing: -.015em; }
    h3 { margin: 30px 0 10px; font-size: 21px; line-height: 1.25; }
    p { margin: 0 0 17px; }
    .lede { color: var(--text); font-size: clamp(18px, 2.4vw, 21px); line-height: 1.52; }
    .muted { color: var(--muted); }
    .answer { margin: 22px 0 28px; padding: 17px 19px; background: var(--accent-soft); border: 1px solid var(--border); border-left: 5px solid var(--accent); border-radius: 12px; }
    .answer strong { font-weight: 850; }
    .table-wrap { max-width: 100%; overflow-x: auto; margin: 18px 0 26px; border: 1px solid var(--border); border-radius: 12px; }
    table { width: 100%; min-width: 560px; border-collapse: collapse; background: var(--surface); }
    th, td { padding: 12px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
    th { background: var(--surface-soft); font-size: 14px; }
    tr:last-child td { border-bottom: 0; }
    figure { margin: 26px 0; }
    figure img { display: block; width: 100%; height: auto; border: 1px solid var(--border); border-radius: 14px; background: #fff; }
    figcaption { margin-top: 10px; color: var(--muted); font-size: 14px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 28px 0 8px; }
    .button { min-height: 46px; display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; border: 1px solid var(--accent); border-radius: 11px; color: #fff; background: var(--accent); font-weight: 800; text-decoration: none; }
    .button:hover { background: var(--accent-hover); }
    .button.secondary { color: var(--accent); background: transparent; }
    .button.secondary:hover { color: var(--text); background: var(--accent-soft); }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 26px; }
    .card { display: grid; gap: 8px; min-height: 150px; padding: 20px; background: var(--surface-soft); border: 1px solid var(--border); border-radius: 14px; text-decoration: none; }
    .card:hover { border-color: var(--accent); background: var(--accent-soft); }
    .card strong { font-size: 19px; }
    .card span { color: var(--muted); }
    .related { display: flex; flex-wrap: wrap; gap: 10px 18px; margin: 0; padding: 0; list-style: none; }
    .related a { color: var(--accent); font-weight: 750; text-underline-offset: 3px; }
    footer { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 18px; margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
    footer a { min-height: 36px; display: inline-flex; align-items: center; padding: 5px; text-underline-offset: 3px; }
    footer a:hover { color: var(--accent-hover); }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    @media (max-width: 760px) {
      .shell { padding: 16px 14px 34px; }
      .topbar { align-items: flex-start; }
      main { padding-top: 30px; }
      .article-shell { padding: 25px 18px; border-radius: 16px; }
      .cards { grid-template-columns: 1fr; }
    }
    @media (max-width: 420px) {
      .shell { padding-inline: 10px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .brand-logo { width: 150px; }
      .control select { width: 100%; }
      h1 { font-size: 32px; }
      .actions { display: grid; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Back to LoadComposer">
        <span class="brand-logo day" aria-hidden="true">__COMPACT_BRAND_DAY__</span>
        <span class="brand-logo night" aria-hidden="true">__COMPACT_BRAND_NIGHT__</span>
      </a>
      <label class="control">
        <span>Theme</span>
        <select id="themeSelect" aria-label="Theme">
          <option value="auto">Automatic</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
    </header>

    <main>
      <nav class="breadcrumb" aria-label="Breadcrumb">__BREADCRUMB_HTML__</nav>
      <article class="article-shell">
        <div class="prose">__MAIN_CONTENT__</div>
      </article>
    </main>

    <footer aria-label="Footer links">
      <a href="/">LoadComposer</a>
      <a href="/guides/">Guides</a>
      <a href="/about/">About</a>
      <a href="/downloads/">Download</a>
      <a href="/legal/privacy/">Privacy</a>
      <a href="/legal/">Legal information</a>
    </footer>
  </div>

  <script>
    (() => {
      const root = document.documentElement;
      const select = document.getElementById("themeSelect");
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      const systemTheme = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
      function resolve(preference) {
        return preference === "auto" ? (systemTheme && systemTheme.matches ? "dark" : "light") : preference;
      }
      function apply(preference) {
        const value = ["auto", "light", "dark"].includes(preference) ? preference : "auto";
        root.dataset.themePreference = value;
        root.dataset.theme = resolve(value);
        root.style.colorScheme = root.dataset.theme;
        themeMeta.setAttribute("content", root.dataset.theme === "dark" ? "#050D16" : "#F4F5F2");
        select.value = value;
        try { localStorage.setItem("loadcomposer.theme", value); } catch (_) {}
      }
      select.addEventListener("change", () => apply(select.value));
      if (systemTheme) systemTheme.addEventListener("change", () => {
        if (root.dataset.themePreference === "auto") apply("auto");
      });
      apply(root.dataset.themePreference || "auto");
    })();
  </script>
</body>
</html>

<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__PAGE_TITLE__</title>
  <meta name="description" content="__PAGE_DESCRIPTION__" />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#F4F5F2" />
  <link rel="canonical" href="__CANONICAL_URL__" />
  <link rel="icon" href="../../assets/loadcomposer-favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="LoadComposer" />
  <meta property="og:title" content="__PAGE_TITLE__" />
  <meta property="og:description" content="__PAGE_DESCRIPTION__" />
  <meta property="og:url" content="__CANONICAL_URL__" />
  <meta property="og:image" content="https://loadcomposer.com/assets/loadcomposer-og-v__VERSION__.png" />
  <script id="loadcomposer-legal-document-data" type="application/json">__PAGE_DATA__</script>
  <script>
    (() => {
      const root = document.documentElement;
      const themes = new Set(["auto", "light", "dark"]);
      let preference = "auto";
      try {
        const stored = localStorage.getItem("loadcomposer.theme");
        if (themes.has(stored)) preference = stored;
      } catch (_) {}
      const systemDark = Boolean(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      const resolved = preference === "auto" ? (systemDark ? "dark" : "light") : preference;
      root.dataset.themePreference = preference;
      root.dataset.theme = resolved;
      root.style.colorScheme = resolved;
    })();
  </script>
  <style>
    :root {
      --bg: #F4F5F2;
      --surface: #FFFFFF;
      --surface-soft: #F1F5F3;
      --text: #13272F;
      --muted: #52656C;
      --border: #D2DCD8;
      --accent: #0D7C75;
      --accent-hover: #096C66;
      --accent-soft: #DDF3F0;
      --focus: #007C73;
      --shadow: 0 1px 2px rgba(16, 36, 46, .05), 0 8px 24px rgba(16, 36, 46, .07);
    }
    :root[data-theme="dark"] {
      --bg: #050D16;
      --surface: #0D1B27;
      --surface-soft: #122330;
      --text: #E2E9EC;
      --muted: #AAB7BE;
      --border: #263B4A;
      --accent: #3BC0B5;
      --accent-hover: #4ACBC0;
      --accent-soft: #102F33;
      --focus: #60D5CB;
      --shadow: 0 1px 0 rgba(255, 255, 255, .035), 0 12px 28px rgba(0, 0, 0, .16);
    }
    * { box-sizing: border-box; }
    html { min-width: 0; scroll-behavior: smooth; background: var(--bg); }
    html:not([data-i18n-ready]) body { visibility: hidden; }
    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.62;
    }
    a { color: inherit; }
    button, select { font: inherit; }
    .shell { width: min(1100px, 100%); margin: 0 auto; padding: 20px 22px 44px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand { display: inline-flex; min-width: 0; align-items: center; color: var(--text); text-decoration: none; }
    .brand-logo { display: none; width: 170px; max-width: 100%; height: auto; }
    .brand-logo svg { display: block; width: 100%; height: auto; }
    :root[data-theme="light"] .brand-logo.day,
    :root[data-theme="dark"] .brand-logo.night { display: block; }
    .controls { display: flex; flex-wrap: wrap; align-items: end; justify-content: flex-end; gap: 10px; }
    .control { display: grid; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .control select {
      min-height: 44px;
      max-width: min(340px, 100%);
      padding: 8px 34px 8px 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    main { padding-top: 38px; }
    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 9px;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }
    .breadcrumb a { min-height: 36px; display: inline-flex; align-items: center; text-underline-offset: 3px; }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb [aria-current="page"] { color: var(--text); font-weight: 750; }
    .article-shell {
      min-width: 0;
      padding: clamp(24px, 4.5vw, 52px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }
    .article-head { width: min(88ch, 100%); margin: 0 auto 30px; }
    h1 { margin: 0; font-size: clamp(32px, 5vw, 50px); line-height: 1.08; letter-spacing: -.035em; overflow-wrap: anywhere; }
    .license-control { width: min(88ch, 100%); display: grid; gap: 8px; margin: 0 auto 26px; }
    .license-control label { color: var(--muted); font-size: 13px; font-weight: 800; }
    .license-control select {
      width: min(660px, 100%);
      min-height: 48px;
      padding: 9px 38px 9px 13px;
      color: var(--text);
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 11px;
      font-weight: 750;
    }
    .legal-note {
      width: min(88ch, 100%);
      margin: 0 auto 28px;
      padding: 14px 17px;
      color: var(--text);
      background: var(--accent-soft);
      border: 1px solid var(--border);
      border-left: 5px solid var(--accent);
      border-radius: 12px;
    }
    .document-panel[hidden] { display: none; }
    .toc {
      width: min(88ch, 100%);
      margin: 0 auto 34px;
      padding: 18px 20px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .toc h2 { margin: 0 0 10px; font-size: 18px; line-height: 1.25; }
    .toc ol { columns: 2 280px; column-gap: 34px; margin: 0; padding-left: 22px; }
    .toc li { break-inside: avoid; margin: 5px 0; }
    .toc a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
    .prose { width: min(88ch, 100%); margin: 0 auto; color: var(--text); overflow-wrap: anywhere; }
    .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 {
      scroll-margin-top: 18px;
      line-height: 1.22;
      letter-spacing: -.012em;
      overflow-wrap: anywhere;
    }
    .prose h2 { margin: 42px 0 15px; font-size: clamp(25px, 3.2vw, 32px); }
    .prose h3 { margin: 34px 0 12px; font-size: 22px; }
    .prose h4, .prose h5, .prose h6 { margin: 28px 0 10px; font-size: 18px; }
    .prose > :first-child { margin-top: 0; }
    .prose p { margin: 0 0 17px; }
    .prose ul, .prose ol { margin: 0 0 20px; padding-left: 28px; }
    .prose li { margin: 7px 0; padding-left: 3px; }
    .prose li > ul, .prose li > ol { margin: 7px 0 0; }
    .prose a, .source-links a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
    .prose code {
      padding: .12em .36em;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 5px;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: .92em;
      word-break: break-word;
    }
    .prose pre {
      max-width: 100%;
      overflow-x: auto;
      padding: 15px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .source-links {
      width: min(88ch, 100%);
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin: 42px auto 0;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
    }
    .source-links a { min-height: 38px; display: inline-flex; align-items: center; }
    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 18px;
      margin-top: 44px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }
    footer a { min-height: 36px; display: inline-flex; align-items: center; padding: 5px; text-underline-offset: 3px; }
    footer a:hover, .breadcrumb a:hover, .source-links a:hover { color: var(--accent-hover); }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    @media (max-width: 760px) {
      .shell { padding: 16px 14px 34px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .controls { width: 100%; justify-content: stretch; }
      .control { flex: 1 1 135px; min-width: 0; }
      .control select { width: 100%; max-width: none; }
      main { padding-top: 30px; }
      .article-shell { padding: 25px 18px; border-radius: 16px; }
      .toc { padding: 16px 17px; }
      .toc ol { columns: 1; }
      .prose ul, .prose ol { padding-left: 23px; }
    }
    @media (max-width: 350px) {
      .shell { padding-inline: 10px; }
      .brand-logo { width: 150px; }
      .controls { display: grid; grid-template-columns: 1fr; }
      h1 { font-size: 32px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Back to LoadComposer" data-i18n-aria-label="downloads.brandHomeAria">
        <span class="brand-logo day" aria-hidden="true">__COMPACT_BRAND_DAY__</span>
        <span class="brand-logo night" aria-hidden="true">__COMPACT_BRAND_NIGHT__</span>
      </a>
      <div class="controls">
        <label class="control">
          <span data-i18n="downloads.language.label">Language</span>
          <select id="languageSelect" aria-label="Language" data-i18n-aria-label="downloads.language.label"></select>
        </label>
        <label class="control">
          <span data-i18n="downloads.theme.label">Theme</span>
          <select id="themeSelect" aria-label="Theme" data-i18n-aria-label="downloads.theme.label">
            <option value="auto" data-i18n="downloads.theme.auto">Automatic</option>
            <option value="light" data-i18n="downloads.theme.light">Light</option>
            <option value="dark" data-i18n="downloads.theme.dark">Dark</option>
          </select>
        </label>
      </div>
    </header>

    <main>
      <nav class="breadcrumb" aria-label="Breadcrumb" data-i18n-aria-label="legal.page.breadcrumbAria">
        <a href="/" data-i18n="downloads.footer.home">Back to LoadComposer</a>
        <span aria-hidden="true">/</span>
        <a href="/legal/" data-i18n="legal.title">Legal information</a>
        <span aria-hidden="true">/</span>
        <span aria-current="page" data-i18n="__TITLE_KEY__">__PAGE_HEADING__</span>
      </nav>

      <article class="article-shell">
        <header class="article-head">
          <h1 data-i18n="__TITLE_KEY__">__PAGE_HEADING__</h1>
        </header>
        __ARTICLE_CONTENT__
        <div class="source-links">__SOURCE_LINKS__</div>
      </article>
    </main>

    <footer aria-label="Footer links" data-i18n-aria-label="footer.linksAria">
      <a href="/" data-i18n="downloads.footer.home">Back to LoadComposer</a>
      <a href="/downloads/" data-i18n="footer.download">Download</a>
      <a href="/legal/privacy/" data-i18n="footer.privacy">Privacy</a>
      <a href="/legal/" data-i18n="footer.legalInformation">Legal information</a>
      <a href="https://github.com/LoadComposer/loadcomposer" target="_blank" rel="noopener noreferrer" data-i18n="legal.footer.repository">Official repository</a>
    </footer>
  </div>

  <script>
    (() => {
      "use strict";
      const data = JSON.parse(document.getElementById("loadcomposer-legal-document-data").textContent);
      const root = document.documentElement;
      const languageSelect = document.getElementById("languageSelect");
      const themeSelect = document.getElementById("themeSelect");
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      const systemTheme = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

      function browserLanguage() {
        const raw = String((navigator.languages && navigator.languages[0]) || navigator.language || "").toLowerCase();
        const prefix = raw.split("-")[0];
        return data.languages.some(item => item.code === prefix) ? prefix : data.defaultLanguage;
      }

      function savedLanguage() {
        try {
          const stored = localStorage.getItem("loadcomposer.language");
          if (data.languages.some(item => item.code === stored)) return stored;
        } catch (_) {}
        return browserLanguage();
      }

      function translate(code) {
        const catalog = data.catalogs[code] || data.catalogs[data.defaultLanguage];
        root.lang = code;
        root.dir = "ltr";
        root.dataset.language = code;
        document.querySelectorAll("[data-i18n]").forEach(element => {
          const key = element.dataset.i18n;
          if (typeof catalog[key] === "string") element.textContent = catalog[key];
        });
        document.querySelectorAll("[data-i18n-aria-label]").forEach(element => {
          const key = element.dataset.i18nAriaLabel;
          if (typeof catalog[key] === "string") element.setAttribute("aria-label", catalog[key]);
        });
        const localizedTitle = catalog[data.page.titleKey] || data.page.fallbackTitle;
        const localizedDescription = `${localizedTitle}. ${catalog["legal.meta.description"]}`;
        document.title = `${localizedTitle} — LoadComposer`;
        document.querySelector('meta[name="description"]').setAttribute("content", localizedDescription);
        document.querySelector('meta[property="og:title"]').setAttribute("content", `${localizedTitle} — LoadComposer`);
        document.querySelector('meta[property="og:description"]').setAttribute("content", localizedDescription);
        languageSelect.value = code;
        try { localStorage.setItem("loadcomposer.language", code); } catch (_) {}
        root.dataset.i18nReady = "true";
      }

      function resolveTheme(preference) {
        return preference === "auto" ? (systemTheme && systemTheme.matches ? "dark" : "light") : preference;
      }

      function setTheme(preference) {
        root.dataset.themePreference = preference;
        root.dataset.theme = resolveTheme(preference);
        root.style.colorScheme = root.dataset.theme;
        themeMeta.setAttribute("content", root.dataset.theme === "dark" ? "#050D16" : "#F4F5F2");
        themeSelect.value = preference;
        try { localStorage.setItem("loadcomposer.theme", preference); } catch (_) {}
      }

      function requestedLicenseLanguage() {
        if (!data.page.licenseSelector) return null;
        const selected = new URL(window.location.href).searchParams.get("lang");
        return selected === "it" ? "it" : "en";
      }

      function selectLicenseLanguage(code, updateHistory) {
        if (!data.page.licenseSelector) return;
        const selected = code === "it" ? "it" : "en";
        root.dataset.licenseLanguage = selected;
        document.querySelectorAll("[data-license-panel]").forEach(panel => {
          panel.hidden = panel.dataset.licensePanel !== selected;
        });
        document.querySelectorAll("[data-license-note]").forEach(note => {
          note.hidden = note.dataset.licenseNote !== selected;
        });
        const selector = document.getElementById("licenseTextSelect");
        if (selector) selector.value = selected;
        if (updateHistory) {
          const url = new URL(window.location.href);
          url.searchParams.set("lang", selected);
          history.pushState({ licenseLanguage: selected }, "", url);
        }
      }

      data.languages.forEach(language => {
        const option = document.createElement("option");
        option.value = language.code;
        option.textContent = language.nativeName;
        languageSelect.append(option);
      });
      languageSelect.addEventListener("change", () => translate(languageSelect.value));
      themeSelect.addEventListener("change", () => setTheme(themeSelect.value));
      if (systemTheme) systemTheme.addEventListener("change", () => {
        if (root.dataset.themePreference === "auto") setTheme("auto");
      });
      const licenseTextSelect = document.getElementById("licenseTextSelect");
      if (licenseTextSelect) {
        licenseTextSelect.addEventListener("change", () => selectLicenseLanguage(licenseTextSelect.value, true));
        window.addEventListener("popstate", () => selectLicenseLanguage(requestedLicenseLanguage(), false));
        selectLicenseLanguage(requestedLicenseLanguage(), false);
      }
      translate(savedLanguage());
      setTheme(root.dataset.themePreference || "auto");
    })();
  </script>
</body>
</html>
